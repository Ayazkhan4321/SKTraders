<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0B1329" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFC107"/>
      <stop offset="75%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#B78103"/>
    </linearGradient>

    <!-- Vibrant Electric Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0040A8"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="10"/>

  <!-- Outer Eagle Wing Silhouette Crest Left -->
  <path d="M 120 280 C 100 200, 160 110, 240 80 C 200 120, 180 170, 190 220 C 160 210, 140 240, 120 280 Z" fill="url(#blueGrad)"/>

  <!-- Outer Eagle Wing Silhouette Crest Right -->
  <path d="M 392 280 C 412 200, 352 110, 272 80 C 312 120, 332 170, 322 220 C 352 210, 372 240, 392 280 Z" fill="url(#blueGrad)"/>

  <!-- Center Eagle Head Profile (Facing Right with Sharp Eagle Beak & Eye) -->
  <g filter="url(#glow)">
    <!-- Eagle Beak -->
    <path d="M 256 160 C 280 160, 330 180, 350 220 C 330 225, 310 220, 290 215 C 270 210, 256 220, 256 220 L 256 160 Z" fill="url(#goldGrad)"/>
    
    <!-- Eagle Head Crown -->
    <path d="M 256 120 C 290 120, 330 145, 345 180 C 310 175, 280 160, 256 160 C 230 160, 200 180, 170 210 C 180 160, 215 120, 256 120 Z" fill="url(#goldGrad)"/>

    <!-- Sharp Eye -->
    <polygon points="295,182 315,188 300,194" fill="#030712"/>
    <circle cx="304" cy="188" r="2.5" fill="#FFE082"/>
  </g>

  <!-- Stylized Wing Feathers forming Lightning 'SK' Monogram below Eagle -->
  <path d="M 160 300 L 230 250 L 200 330 L 280 270 L 240 370 L 350 290 L 310 400 L 370 330" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lettering Badge: SK TRADERS -->
  <text x="256" y="445" font-family="'Outfit', 'Helvetica', sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
    SK TRADERS
  </text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#FFC107" text-anchor="middle" letter-spacing="4">
    PHILIPS DISTRIBUTOR
  </text>
</svg>
